[project]
name = "league-hub-ingest"
version = "0.1.0"
description = "Offline ESPN fantasy football data ingest for the league hub"
requires-python = ">=3.11"
dependencies = [
    "espn-api>=0.45",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "scipy>=1.12",
    "numpy>=1.26",
    "tzdata>=2026.3",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
