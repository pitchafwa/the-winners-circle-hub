    # (24 game(s) still startTimeTBD as of 2026-09-18 — picked up automatically once the weekly regenerate job sees a real kickoff time for them. Every-6h fallback above covers them until then.)

permissions:
  contents: write  # also what the "Trigger deploy" step's repository_dispatch call needs
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # A push made with the default GITHUB_TOKEN does NOT trigger other
      # workflows' `on: push` — a GitHub anti-recursion safeguard. That
      # silently broke deploy-pages.yml for every single refresh run since
      # it started (confirmed 2026-09-02: 72/72 "Refresh league data" runs,
      # zero matching "Deploy to GitHub Pages" runs — the live site was
      # stuck on whatever data existed at the last real code push, not the
      # latest refresh, this whole time).
      #
      # First fix tried (2026-09-02, since reverted): push authenticated as
      # a real PAT (WORKFLOW_PAT) instead, since a push from a real token
      # DOES trigger downstream workflows normally. Broke this workflow
      # entirely (2026-09-02 20:15 ET on) — that secret was never actually
      # created (confirmed with Tommy: "we never made that"), so every run
      # failed at this exact checkout step with "Input required and not
      # supplied: token" before doing anything at all — worse than the
      # original bug, which at least still refreshed the data. The other
      # workflow that already referenced this same secret
      # (update-refresh-schedule.yml) had silently failed the identical
      # way on its own first-ever run (2026-08-31) and nobody had noticed,
      # since it only runs weekly — the secret's absence long predates
      # this workflow depending on it.
      #
      # Real fix: don't depend on a real-token push at all. Check out with
      # the plain default GITHUB_TOKEN (always present, needs no manual
      # setup) and explicitly dispatch deploy-pages.yml via the Actions API
      # in the "Trigger deploy" step below instead — GITHUB_TOKEN CAN
      # trigger a workflow_dispatch run (unlike a push, which the anti-
      # recursion rule blocks) as long as `actions: write` is granted,
      # which costs nothing to grant and needs no secret anyone has to
      # remember to create.
      - uses: actions/checkout@v4

      # ingest/.cache/ is gitignored (it's raw ESPN/KTC API responses, not
      # something that belongs in the repo) — but a fresh checkout with an
      # empty cache means EVERY run has to cold-fetch everything, including
      # immutable historical box scores that never change once a week is
      # final. Worse than just slow: build.py takes an empty box-score cache
      # for a past season as "this season has no data" and (before
      # 2026-08-26) would erase that season's real matchups/superlatives/
      # activity/teams history as a result. Restoring this across runs is
      # the actual fix — the per-write guards added the same day are a
      # backstop, not a substitute. Always saves under a fresh key (the
      # cache only ever grows — a new completed week, a newly-fetched past
      # season) and restores the most recent prior save via the key prefix.
      - uses: actions/cache@v4
        with:
          path: ingest/.cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install ingest dependencies
        working-directory: ingest
        run: ~/.local/bin/uv sync

      - name: Run ingest
        working-directory: ingest
        env:
          # Python fully block-buffers stdout when it isn't a real
          # terminal (true here) — without this, build.py's own print()
          # progress lines can sit invisible in the live Actions log for
          # minutes even though the run is progressing normally
          # underneath, which reads as a hang when it may not be one.
          PYTHONUNBUFFERED: "1"
          LEAGUE_ID: "29471"
          # Set these as repository secrets before enabling the schedule above.
          # Public-league fetches work without them; they're only needed to
          # keep 2017-2023 history refreshable (ESPN gates that far back) —
          # and only on the FIRST run that ever needs to fetch a given past
          # season, since the cache above persists it after that.
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          # Also a repository secret — needed for the FantasyPros weekly
          # projections on the My Team roster (fp_projections.py). Free
          # tier, 50 requests/day; missing entirely just means that
          # column stays blank, same "optional" pattern as ESPN_S2/SWID.
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: ~/.local/bin/uv run python build.py

      - name: Commit changed data
        id: commit
        run: |
          git config user.name "league-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          if git diff --cached --quiet; then
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Refresh league data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Plain `git push` had no retry — a tighter refresh cadence
          # means overlapping runs (or a manual push landing at the same
          # moment) are more likely to collide, and an unretried push
          # rejection here silently drops that whole refresh window
          # (caught happening for real 2026-09-13: a manual push during
          # this same session collided with a scheduled run's push).
          # Retry a few times, rebasing onto whatever landed first each
          # time, before giving up for real.
          for attempt in 1 2 3 4 5; do
            if git push; then
              break
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest and retrying..."
            git pull --rebase origin main
            if [ "$attempt" = "5" ]; then
              echo "push still failing after 5 attempts, giving up"
              exit 1
            fi
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Explicit dispatch instead of relying on the push above to trigger
      # deploy-pages.yml's own `on: push` — see this job's first step for
      # why a GITHUB_TOKEN-authenticated push never fires that trigger.
      # Only worth doing when there was actually a new commit to deploy.
      #
      # A `repository_dispatch` carrying the EXACT sha this job just
      # pushed, not a plain `gh workflow run deploy-pages.yml` (caught
      # live, 2026-09-14 — Tommy: "no players are showing up bold for me
      # yet" right after a real feature shipped, traced to this). Why:
      # `gh workflow run`'s `--ref` only accepts a branch/tag name, not a
      # commit sha — passing no ref at all resolves against the default
      # branch as GitHub's API sees it AT DISPATCH TIME, which two
      # consecutive real refresh runs both showed resolving to the
      # PREVIOUS commit, not this run's own freshly-pushed one (a real,
      # reproducible one-cycle lag, not a one-off timing fluke).
      # `repository_dispatch` sidesteps the ref-resolution race entirely:
      # deploy-pages.yml's own checkout step explicitly uses the sha from
      # this payload rather than trusting whatever "main" resolves to.
      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/dispatches" \
            -f event_type=refresh-deploy \
            -f "client_payload[sha]=${{ steps.commit.outputs.sha }}"
