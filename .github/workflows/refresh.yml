name: Refresh league data

# Deliberately manual-only for now (workflow_dispatch). The intended cron
# schedule is written below but commented out — uncomment it only when
# told to go live. A *live* `schedule:` trigger starts firing the moment
# this file lands on the default branch, so leaving it commented is the
# actual mechanism for "disabled until I say so," not just a suggestion.
#
# Intended schedule (approximate — GitHub Actions cron is UTC-only and
# doesn't observe DST, so these times drift by an hour across the EST/EDT
# boundary; nudge by an hour after the fact if a run lands off-window):
#   - every 15 min, Sun 1pm-midnight ET      (game day, high refresh rate)
#   - hourly, Mon-Tue                        (Monday/Thursday-adjacent news)
#   - every 6 hours, Wed-Sat                 (quiet stretch)
#
# on:
#   schedule:
#     - cron: "*/15 18-23 * * 0"   # Sun 1pm-7:59pm ET
#     - cron: "*/15 0-4 * * 1"     # Sun 8pm-11:59pm ET (rolls into Mon UTC)
#     - cron: "0 5-23 * * 1"       # Mon, hourly
#     - cron: "0 * * * 2"          # Tue, hourly
#     - cron: "0 */6 * * 3-6"      # Wed-Sat, every 6 hours

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install ingest dependencies
        working-directory: ingest
        run: ~/.local/bin/uv sync

      - name: Run ingest
        working-directory: ingest
        env:
          LEAGUE_ID: "29471"
          # Set these as repository secrets before enabling the schedule above.
          # Public-league fetches work without them; they're only needed to
          # keep 2018-2023 history refreshable (ESPN gates that far back).
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
        run: ~/.local/bin/uv run python build.py

      - name: Commit changed data
        run: |
          git config user.name "league-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet && echo "No data changes." && exit 0
          git commit -m "Refresh league data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
