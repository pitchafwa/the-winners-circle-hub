name: Refresh league data

# Live as of 2026-08-25 (Tommy's go-ahead).
#
# The game-window entries between the BEGIN/END markers below are generated
# from the REAL NFL schedule (ingest/generate_refresh_schedule.py, which
# reads ESPN's exact per-game kickoff times) rather than a static day-of-week
# guess — every 15 minutes during any actual game window, whichever day of
# the week it lands on (Wed/Thu/Fri/Sat/Sun/Mon all appear some week: season
# openers, Thanksgiving, Black Friday, Christmas, late-season Saturdays).
# Each entry pins an exact UTC month/day, since GitHub Actions cron has no
# "this specific date" concept otherwise.
#
# update-refresh-schedule.yml re-runs the generator weekly and rewrites just
# the marked block in place (via `generate_refresh_schedule.py --write`),
# so flex-scheduled games (`startTimeTBD` at generation time, skipped and
# re-checked the following week) and next year's schedule both resolve on
# their own — the only thing that still needs a human is bumping SEASON in
# `.env`/the repo's `SEASON` variable once a year when a new league year
# starts (the whole app keys off that, not just this file). See that
# workflow for the one-time setup it needs (a PAT with `workflow` scope,
# since GITHUB_TOKEN can't push changes under .github/workflows/ on its own).
#
# To regenerate by hand instead, from ingest/ with the venv active:
#   uv run python generate_refresh_schedule.py <season> --write
#
# The three hand-written entries below are the always-on safety net: catches
# any gap in the generated block (a TBD game whose window wasn't known yet,
# a schedule change, this file going stale) without needing 15-min-everywhere
# coverage the rest of the time.
#
# 2026-08-27 incident: this workflow ran fine 4 times (2026-08-25T23:01
# through 2026-08-26T14:27 UTC, all "success" per the Actions API), then
# GitHub's scheduler stopped invoking it entirely — confirmed via the API
# (workflow `state: "active"`, zero run attempts recorded, not even
# failures, for 24+ hours afterward despite the every-6-hours fallback
# above). File content was unchanged across that gap, cron syntax in every
# entry checked valid (all 5 fields), repo isn't archived/disabled, and
# being public it has unlimited Actions minutes (no billing cutoff). This
# matches a known-but-undocumented GitHub Actions failure mode: a
# previously-working `schedule` trigger can silently stop firing with no
# visible error anywhere. The community-reported fix is exactly this — a
# fresh push touching the workflow file forces GitHub to re-register its
# schedule. If this recurs, check (a) Settings -> Actions -> General
# permissions haven't been restricted, since that's the one thing GitHub's
# public API won't reveal without repo-scoped auth, and (b) consider an
# external watchdog (something outside GitHub Actions itself, since the
# scheduler failing to invoke THIS workflow means a self-check step
# inside it can't detect its own non-invocation) that polls
# api.github.com/repos/.../actions/workflows/refresh.yml/runs and alerts
# if the latest run is older than a few hours during the season.
#
# 2026-09-15 recurrence: same failure mode, caught live mid-Monday-Night-
# Football by Tommy noticing two players' live scores looked stale
# (Kenneth Walker III, Rashee Rice — their real stats had moved on well
# past what the site showed). Confirmed the same signature: `state:
# "active"`, cron correctly generated and covering this exact window
# (`*/5 0-4 15 9 *`), runs firing normally every ~10-15 min right up
# through 2026-09-15T00:24:45Z, then nothing at all for 80+ minutes
# despite the every-5-min game-window cron that should have fired ~16
# times in that gap. This same push-touches-the-file fix applied again.
# Two recurrences now (2026-08-27, 2026-09-15) — worth actually building
# the external watchdog mentioned above rather than continuing to catch
# this by a person happening to notice stale scores.
#
# 2026-09-18 recurrence (3rd time): same signature again, this time
# during Thursday Night Football — a real scheduled run at
# 2026-09-18T00:10:57Z, then nothing automatic for 100+ minutes despite
# the generated every-5-min window (`*/5 0-4 18 9 *`) actively covering
# that whole gap; a manual workflow_dispatch at 01:57:35Z refreshed the
# data once but did not restart the automatic schedule either (no
# "schedule"-triggered runs followed it).
#
# Real fix applied same day, after actually researching this instead of
# just pushing-and-hoping a third time: GitHub staff have publicly
# confirmed (github.com/orgs/community/discussions/185355, /185373)
# that scheduled workflows can be delayed or silently DROPPED during
# high-load periods, and independent real-world measurement found the
# worst congestion clusters at exactly the round minutes everyone
# else's cron also uses — :00, :05, :10, :15, :30 — which is precisely
# what every cron entry below and in the generated block used
# (`*/5`/`0 ...`). Every entry here now fires 3 minutes off those round
# numbers instead (`generate_refresh_schedule.py`'s `REFRESH_MINUTE_
# OFFSET`, and the three fallback entries below by hand) — a real,
# documented, no-external-dependency fix for exactly this failure mode,
# not a guess, though GitHub's own docs are explicit that scheduled
# triggers are still best-effort, never a hard guarantee.

on:
  workflow_dispatch: {}
  schedule:
    # --- always-on fallback -------------------------------------------
    - cron: "3 5-23 * * 1"       # Mon, hourly (post-MNF news even outside the generated window) — :03, not :00, see the 2026-09-18 congestion note above
    - cron: "3 * * * 2"          # Tue, hourly (post-MNF/roster news)
    - cron: "3 */6 * * *"        # every 6 hours, every day (safety net for any gap above)
    # BEGIN GENERATED SCHEDULE (generate_refresh_schedule.py --write; do not hand-edit between these markers)
