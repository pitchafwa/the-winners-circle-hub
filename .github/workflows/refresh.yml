    # END GENERATED SCHEDULE
    # (24 game(s) still startTimeTBD as of 2026-08-25 — picked up automatically once the weekly regenerate job sees a real kickoff time for them. Every-6h fallback above covers them until then.)

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ingest/.cache/ is gitignored (it's raw ESPN/KTC API responses, not
      # something that belongs in the repo) — but a fresh checkout with an
      # empty cache means EVERY run has to cold-fetch everything, including
      # immutable historical box scores that never change once a week is
      # final. Worse than just slow: build.py takes an empty box-score cache
      # for a past season as "this season has no data" and (before
      # 2026-08-26) would erase that season's real matchups/superlatives/
      # activity/teams history as a result. Restoring this across runs is
      # the actual fix — the per-write guards added the same day are a
      # backstop, not a substitute. Always saves under a fresh key (the
      # cache only ever grows — a new completed week, a newly-fetched past
      # season) and restores the most recent prior save via the key prefix.
      - uses: actions/cache@v4
        with:
          path: ingest/.cache
          key: espn-cache-${{ github.run_id }}
          restore-keys: |
            espn-cache-

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install ingest dependencies
        working-directory: ingest
        run: ~/.local/bin/uv sync

      - name: Run ingest
        working-directory: ingest
        env:
          # Python fully block-buffers stdout when it isn't a real
          # terminal (true here) — without this, build.py's own print()
          # progress lines can sit invisible in the live Actions log for
          # minutes even though the run is progressing normally
          # underneath, which reads as a hang when it may not be one.
          PYTHONUNBUFFERED: "1"
          LEAGUE_ID: "29471"
          # Set these as repository secrets before enabling the schedule above.
          # Public-league fetches work without them; they're only needed to
          # keep 2017-2023 history refreshable (ESPN gates that far back) —
          # and only on the FIRST run that ever needs to fetch a given past
          # season, since the cache above persists it after that.
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          SWID: ${{ secrets.SWID }}
          # Also a repository secret — needed for the FantasyPros weekly
          # projections on the My Team roster (fp_projections.py). Free
          # tier, 50 requests/day; missing entirely just means that
          # column stays blank, same "optional" pattern as ESPN_S2/SWID.
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
        run: ~/.local/bin/uv run python build.py

      - name: Commit changed data
        run: |
          git config user.name "league-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/public/data
          git diff --cached --quiet && echo "No data changes." && exit 0
          git commit -m "Refresh league data ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git push
